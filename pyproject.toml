[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tarantula-studio"
version = "0.1.0"
description = "Linux GUI configurator for GameSir T4 Nova Pro (Super Nova) and Tarantula controllers"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tarantula Studio contributors" }]
keywords = ["gamesir", "tarantula", "t4-nova-pro", "super-nova", "controller", "hidraw", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["PySide6>=6.5"]

[project.scripts]
tarantula-studio = "tarantula_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["tarantula_studio*"]

[tool.setuptools.package-data]
tarantula_studio = ["assets/*.svg"]
